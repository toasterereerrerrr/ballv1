<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Physics</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
    color: white;
    text-align: center;
  }
  canvas { display: block; }
  #start, #menu {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    padding: 12px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Ball Game</h1>
  <button id="start">Start Game</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const ball = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 15,
  vx: 0,
  vy: 0
};

let tiltX = 0, tiltY = 0;

const ACCEL = 0.5;
const FRICTION = 0.99;
const BOUNCE = 0.9;
const MAX_SPEED = 20;

let gameRunning = false;

// Hole position
const hole = {
  x: canvas.width / 4,
  y: canvas.height / 2,
  r: 30
};

document.getElementById("start").onclick = async () => {
  if (typeof DeviceOrientationEvent?.requestPermission === "function") {
    await DeviceOrientationEvent.requestPermission();
  }
  document.getElementById("menu").style.display = "none";
  resetBall();
  gameRunning = true;
};

window.addEventListener("deviceorientation", e => {
  tiltX = (e.gamma || 0) / 30;
  tiltY = (e.beta || 0) / 30;
});

function resetBall() {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.vx = 0;
  ball.vy = 0;
}

function update() {
  if (!gameRunning) return;

  // acceleration from tilt
  ball.vx += tiltX * ACCEL;
  ball.vy += tiltY * ACCEL;

  // clamp speed
  ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
  ball.vy = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vy));

  // apply friction
  ball.vx *= FRICTION;
  ball.vy *= FRICTION;

  // move
  ball.x += ball.vx;
  ball.y += ball.vy;

  // wall collisions
  if (ball.x < ball.r) {
    ball.x = ball.r;
    ball.vx *= -BOUNCE;
  }
  if (ball.x > canvas.width - ball.r) {
    ball.x = canvas.width - ball.r;
    ball.vx *= -BOUNCE;
  }
  if (ball.y < ball.r) {
    ball.y = ball.r;
    ball.vy *= -BOUNCE;
  }
  if (ball.y > canvas.height - ball.r) {
    ball.y = canvas.height - ball.r;
    ball.vy *= -BOUNCE;
  }

  // check if ball fell into hole
  const dx = ball.x - hole.x;
  const dy = ball.y - hole.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < ball.r + hole.r) {
    gameRunning = false;
    document.getElementById("menu").style.display = "block";
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // draw neon hole
  ctx.save();
  ctx.fillStyle = "#00ffea";       // neon cyan color
  ctx.shadowBlur = 30;             // glow size
  ctx.shadowColor = "#00ffea";     // glow color
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // draw ball
  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
