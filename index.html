<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Physics</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
    color: white;
    text-align: center;
  }
  canvas { display: block; }

  /* Main menu styling */
  #menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black; /* full black background */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  #menu h1 {
    font-size: 60px;
    margin-bottom: 50px;
    color: #00ffea;
    text-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
  }

  button {
    font-size: 30px;
    padding: 15px 50px;
    margin: 20px;
    background: black;
    border: 2px solid #00ffea;
    color: #00ffea;
    cursor: pointer;
    text-shadow: 0 0 5px #00ffea, 0 0 10px #00ffea;
    box-shadow: 0 0 10px #00ffea, 0 0 20px #00ffea, 0 0 30px #00ffea;
    transition: 0.2s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #00ffea, 0 0 40px #00ffea, 0 0 60px #00ffea;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Ball Game</h1>
  <button id="start">Start Game</button>
  <button id="exit">Exit Game</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const ball = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 15,
  vx: 0,
  vy: 0,
  falling: false
};

let tiltX = 0, tiltY = 0;

const ACCEL = 0.5;
const FRICTION = 0.99;
const BOUNCE = 0.9;
const MAX_SPEED = 20;

let gameRunning = false;

// Hole position
const hole = {
  x: canvas.width / 4,
  y: canvas.height / 2,
  r: 30
};

// Start button
document.getElementById("start").onclick = async () => {
  if (typeof DeviceOrientationEvent?.requestPermission === "function") {
    await DeviceOrientationEvent.requestPermission();
  }
  document.getElementById("menu").style.display = "none";
  resetBall();
  gameRunning = true;
};

// Exit button
document.getElementById("exit").onclick = () => {
  window.close(); // closes tab (may not work in some browsers)
};

window.addEventListener("deviceorientation", e => {
  tiltX = (e.gamma || 0) / 30;
  tiltY = (e.beta || 0) / 30;
});

function resetBall() {
  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.vx = 0;
  ball.vy = 0;
  ball.r = 15;
  ball.falling = false;
}

function update() {
  if (!gameRunning) return;

  if (!ball.falling) {
    // normal tilt physics
    ball.vx += tiltX * ACCEL;
    ball.vy += tiltY * ACCEL;

    ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
    ball.vy = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vy));

    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // wall collisions
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -BOUNCE; }
    if (ball.x > canvas.width - ball.r) { ball.x = canvas.width - ball.r; ball.vx *= -BOUNCE; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -BOUNCE; }
    if (ball.y > canvas.height - ball.r) { ball.y = canvas.height - ball.r; ball.vy *= -BOUNCE; }

    // check if ball should start falling into hole
    const dx = ball.x - hole.x;
    const dy = ball.y - hole.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < hole.r + ball.r) {
      ball.falling = true;
    }
  } else {
    // pull ball toward center of hole
    const dx = hole.x - ball.x;
    const dy = hole.y - ball.y;
    ball.vx += dx * 0.05;
    ball.vy += dy * 0.05;

    ball.vx *= 0.9;
    ball.vy *= 0.9;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // shrink the ball to simulate falling in
    if (ball.r > 0.5) ball.r *= 0.96;

    // when ball is small enough, end game
    if (ball.r <= 0.5) {
      gameRunning = false;
      document.getElementById("menu").style.display = "flex";
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // draw neon hole
  ctx.save();
  ctx.fillStyle = "#00ffea";
  ctx.shadowBlur = 30;
  ctx.shadowColor = "#00ffea";
  ctx.beginPath();
  ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // draw ball
  ctx.fillStyle = "cyan";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
